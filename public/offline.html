<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FocusBoard Offline</title>
    <style>
      body {
        margin: 0;
        background: #fafaf9;
        color: #18181b;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      section {
        max-width: 440px;
        border: 1px solid #e4e4e7;
        border-radius: 8px;
        background: white;
        padding: 24px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
      }
      p {
        color: #52525b;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Offline</h1>
        <p>
          FocusBoard cannot reach the network. Reopen a page you visited recently,
          or reconnect and refresh.
        </p>
      </section>
    </main>
  </body>
</html>
